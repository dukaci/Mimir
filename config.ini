[monitor]
# Sampling interval in seconds (0.1 to 10.0)
sample_interval = 1.0

# Number of samples to keep in memory (60-3600, roughly 1 min to 1 hour at 1s intervals)
history_length = 300

[display]
# Maximum number of processes to show individually (1-20)
# Processes with lower CPU usage will be grouped into "Others"
top_processes = 10

# Minimum CPU percentage to track a process (0.1-10.0)
# Processes below this threshold are ignored
cpu_threshold = 1.0

# Color scheme for the plot (future feature)
color_scheme = default