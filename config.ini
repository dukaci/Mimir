[monitor]
sample_interval = 1.0
history_length = 300

[display]
top_processes = 3
cpu_threshold = 1.0
color_scheme = default
filter_idle = True
group_processes = True
left_panel_width = 500
table_row_limit = 20
aggregation_window = 30
chart_max_seconds = 60
sort_by = network_up

[network]
enabled = True
view_mode = network

