[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "1.0.0"
description = "Per-process resource monitor with history and peaks (CPU, memory, disk, network, GPU)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "dearpygui>=2.0",
    "nvidia-ml-py>=12.0",
    "pydivert>=2.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mimir = "mimir.__main__:main"

[tool.setuptools.packages.find]
include = ["mimir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
